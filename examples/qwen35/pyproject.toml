[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kohakugbc-qwen35"
version = "0.1.0"
description = "A specialised Qwen3.5 VLM engine for KohakuGBC's vlm slot (example)"
authors = [
    { name = "Shih-Ying Yeh(KohakuBlueLeaf)", email = "apolloyeh0123@gmail.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "kohakugbc[torch]",
    "torch>=2.6",
    "transformers>=5.20",
    "flash-linear-attention>=0.5",
    "triton>=3.3; sys_platform != 'win32'",
    "triton-windows>=3.3; sys_platform == 'win32'",
    "xgrammar>=0.2",
]

[project.entry-points."kohakugbc.entries"]
qwen35 = "qwen35.unit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "PERF", "RUF100", "PLC0415"]
ignore = ["B905", "PERF203", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["qwen35", "kohakugbc"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device",
    "weights: loads a Qwen3.5 checkpoint (QWEN35_MODEL)",
]
