name: CI

on:
  push:
    branches: [main]
  pull_request:

# A compute project: CI checks the code's form only; results are checked by runs on the cards
jobs:
  rust:
    name: Rust (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  lint:
    name: Lint and boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install black ruff
      - name: black
        run: python -m black --check --line-length 100 src tests scripts configs
      - name: ruff
        run: python -m ruff check src tests scripts configs
      - name: Import boundary
        run: python scripts/check_imports.py
      - name: Markdown code blocks
        run: python scripts/check_md_black.py .
