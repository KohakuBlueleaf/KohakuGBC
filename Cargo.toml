[package]
name = "kohakugbc"
# The one version of the package; pyproject.toml reads it (dynamic = ["version"]).
version = "0.1.0"
edition = "2021"
description = "The native part of KohakuGBC: GBC graph resolution and storage"
license = "Apache-2.0"
repository = "https://github.com/KohakuBlueleaf/KohakuGBC"
include = ["/src/kohakugbc-rust/**", "/Cargo.toml", "/Cargo.lock", "/rustfmt.toml", "/LICENSE"]

[lib]
name = "_rs"     # == python module path: kohakugbc/_rs
crate-type = ["cdylib", "rlib"]
path = "src/kohakugbc-rust/lib.rs"

[dependencies]
pyo3 = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = "2"
rmp-serde = "1.3"
zstd = "0.13"

[features]
# A wheel build links no libpython; `cargo test --no-default-features` links it, so the
# unit tests run as a normal binary.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
