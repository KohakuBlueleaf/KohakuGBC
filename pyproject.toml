[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "kohakugbc"
# maturin reads the version from Cargo.toml.
dynamic = ["version"]
description = "KohakuGBC: Graph-Based Captioning as a KIR program on the Togeari dataflow machine, with its engines"
authors = [
    { name = "Shih-Ying Yeh(KohakuBlueLeaf)", email = "apolloyeh0123@gmail.com" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "togeari[web]>=0.3.0",
    "httpx>=0.27",
    "kohakunode>=0.3.0",
    "pillow>=10",
    "numpy>=2",
    "scipy>=1.11",
    "hbutils>=0.14",
    "supervision>=0.25",
    "opencv-python-headless>=4.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://kblueleaf.net/"
Repository = "https://github.com/KohakuBlueleaf/KohakuGBC"

[project.optional-dependencies]
# The vision models (detector, embedder) on Togeari's torch engine
torch = [
    "togeari[torch]>=0.3.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=5.20",
    "sentence-transformers>=6.1",
    "inflect>=7",
]
# The in-process VLM (Linux)
vllm = ["vllm>=0.11"]
# The qwen35 VLM engine (Windows and Linux)
qwen35 = [
    "kohakugbc[torch]",
    "flash-linear-attention>=0.5",
    "triton>=3.3; sys_platform != 'win32'",
    "triton-windows>=3.3; sys_platform == 'win32'",
    "xgrammar>=0.2",
]
parquet = ["pyarrow>=15"]
dev = [
    "maturin>=1.9,<2.0",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff",
    "black",
    "httpx>=0.27",
    "togeari[web]>=0.3.0",
]

[project.scripts]
gbc = "kohakugbc.cli.main:main"

[tool.maturin]
# Python source is in src/kohakugbc; the crate is src/kohakugbc-rust (Cargo.toml). The models GBC
# runs itself, their kernels and the numerics are one standalone package beside it.
python-source = "src"
module-name = "kohakugbc._rs"
python-packages = ["kohakugbc_models"]
include = ["src/kohakugbc/**/*.kir", "src/kohakugbc/**/*.json", "src/kohakugbc/**/*.txt"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "PERF", "RUF100", "PLC0415"]
ignore = ["B905", "PERF203"]

[tool.ruff.lint.per-file-ignores]
# Triton kernels name their output pointer O
"src/kohakugbc_models/vlm/qwen35/ops/backends/triton/*.py" = ["E741"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device; `-m \"not gpu\"` runs the CPU-only suite",
    "serial: asserts a wall-clock bound or a scheduling outcome; runs in its own pass without pytest-xdist (`-m serial`)",
    "weights: loads real model weights (downloads on first use)",
]
